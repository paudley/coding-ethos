.coding_ethos_sarif:
  stage: test
  variables:
    CODING_ETHOS_PATH: coding-ethos
    CODING_ETHOS_REPO_ROOT: .
    CODING_ETHOS_GATE_COMMAND: make check
    CODING_ETHOS_SARIF_PATH: coding-ethos.sarif
    CODING_ETHOS_FILES: ""
  script:
    - make -C "$CODING_ETHOS_PATH" build
    - |
      if [ -n "$CODING_ETHOS_GATE_COMMAND" ]; then
        cd "$CODING_ETHOS_REPO_ROOT"
        bash -lc "$CODING_ETHOS_GATE_COMMAND"
        cd "$CI_PROJECT_DIR"
      fi
    - |
      repo_root="$(cd "$CODING_ETHOS_REPO_ROOT" && pwd)"
      ethos_path="$(cd "$CODING_ETHOS_PATH" && pwd)"
      files="$CODING_ETHOS_FILES"

      if [ -z "$files" ] && [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_SHA" ]; then
        files="$(
          git diff --name-only "$CI_MERGE_REQUEST_TARGET_BRANCH_SHA"...HEAD |
            paste -sd, -
        )"
      fi

      if [ -z "$files" ]; then
        files="$(git ls-files | paste -sd, -)"
      fi

      "$ethos_path/pre-commit/hooks/run-go-hook.sh" policy-lint \
        --cwd "$repo_root" \
        --scope files \
        --files "$files" \
        --sarif > "$CODING_ETHOS_SARIF_PATH"
  artifacts:
    when: always
    paths:
      - "$CODING_ETHOS_SARIF_PATH"
      - .coding-ethos/lint-runs/
      - .coding-ethos/hook-runs/
