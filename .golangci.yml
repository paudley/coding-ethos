version: '2'
run:
  tests: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: standard
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - gocheckcompilerdirectives
    - gomoddirectives
    - goprintffuncname
    - gosec
    - govet
    - makezero
    - misspell
    - nilerr
    - nilnesserr
    - nilnil
    - nolintlint
    - nosprintfhostport
    - predeclared
    - recvcheck
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unqueryvet
    - unused
    - usestdlibvars
    - wastedassign
  exclusions:
    generated: strict
    warn-unused: true
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
  settings:
    cyclop:
      max-complexity: 12
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: Use standard errors plus fmt.Errorf("%w") wrapping.
            - pkg: io/ioutil
              desc: Use os or io package replacements.
    errcheck:
      check-blank: false
      check-type-assertions: false
    funlen:
      lines: 80
      statements: 60
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 12
    gosec:
      excludes:
        - G101
        - G110
        - G115
        - G122
        - G202
        - G204
        - G306
        - G304
        - G602
        - G702
        - G703
    gomoddirectives:
      replace-allow-list: []
      retract-allow-no-explanation: false
      exclude-forbidden: false
    lll:
      tab-width: 1
      line-length: 88
    nestif:
      min-complexity: 4
    revive:
      severity: error
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
    testifylint:
      enable-all: true
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  exclusions:
    generated: strict
    warn-unused: true
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(blackcat.ca/coding-ethos/go)
        - localmodule
    gofmt:
      simplify: true
    gofumpt:
      extra-rules: true
      module-path: blackcat.ca/coding-ethos/go
    goimports:
      local-prefixes:
        - blackcat.ca/coding-ethos/go
    golines:
      max-len: 88
      tab-len: 1
