version: '2'
run:
  tests: true
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - containedctx
    - contextcheck
    - copyloopvar
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - err113
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forbidigo
    - forcetypeassert
    - funcorder
    - funlen
    - gocheckcompilerdirectives
    - gochecknoglobals
    - gochecknoinits
    - gochecksumtype
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godoclint
    - godot
    - godox
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - interfacebloat
    - intrange
    - iotamixing
    - lll
    - loggercheck
    - maintidx
    - makezero
    - mirror
    - mnd
    - modernize
    - musttag
    - nakedret
    - nestif
    - nilerr
    - nilnesserr
    - nilnil
    - nlreturn
    - noctx
    - noinlineerr
    - nolintlint
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - promlinter
    - protogetter
    - reassign
    - recvcheck
    - revive
    - rowserrcheck
    - sloglint
    - spancheck
    - sqlclosecheck
    - staticcheck
    - tagalign
    - tagliatelle
    - testableexamples
    - testpackage
    - testifylint
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unqueryvet
    - unused
    - usestdlibvars
    - usetesting
    - varnamelen
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5
    - zerologlint
  exclusions:
    generated: strict
    warn-unused: true
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
  settings:
    cyclop:
      max-complexity: 12
    depguard:
      rules:
        main:
          deny:
            - pkg: github.com/pkg/errors
              desc: Use standard errors plus fmt.Errorf("%w") wrapping.
            - pkg: io/ioutil
              desc: Use os or io package replacements.
    errcheck:
      check-blank: true
      check-type-assertions: true
    funlen:
      lines: 80
      statements: 60
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 12
    gosec:
      excludes:
        - G101
        - G304
    govet:
      enable-all: true
    gomoddirectives:
      replace-allow-list: []
      retract-allow-no-explanation: false
      exclude-forbidden: false
    lll:
      tab-width: 1
      line-length: 88
    nestif:
      min-complexity: 4
    revive:
      severity: error
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake
    testifylint:
      enable-all: true
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  exclusions:
    generated: strict
    warn-unused: true
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(blackcat.ca/coding-ethos/go)
        - localmodule
    gofmt:
      simplify: true
    gofumpt:
      extra-rules: true
      module-path: blackcat.ca/coding-ethos/go
    goimports:
      local-prefixes:
        - blackcat.ca/coding-ethos/go
    golines:
      max-len: 88
      tab-len: 1
