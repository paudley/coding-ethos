style:
  line_length: 100

repo:
  license:
    # Set this per consuming repo to opt into LICENSE file and header checks.
    # When enabled, coding-ethos downloads the SPDX text, validates LICENSE
    # without overwriting it, and requires matching source headers.
    # spdx_identifier: MIT
    # copyright: 2026 Example Inc.
    # license_file: LICENSE

hooks:
  output_format: auto
  success_output: silent
  parallel_groups: true
  tool_timeout_seconds: 300
  agent_env_markers:
    - CODEX_THREAD_ID
    - CLAUDE_CODE_ENTRYPOINT
    - GEMINI_CLI
  enabled_groups:
    - syntax
    - python-policy
    - python-static
    - docs
    - security
    - shell
    - docker
    - workflow
    - python-quality
    - go
    - ai
    - commit-msg

git:
  hook_bypass:
    enabled: true
  stash_blocked:
    enabled: true
  staged_admin_files:
    enabled: true
    basenames:
      - pyproject.toml
      - repo_config.yaml
    dirs:
      - .github

filesystem:
  protected_path:
    enabled: true
    paths:
      - /usr/bin/got
  protected_branch_write:
    enabled: true
    branches:
      - main
      - release
    exempt_path_prefixes:
      - .claude/
      - docs/plans/

shell:
  dangerous_command:
    enabled: true
  background_git:
    enabled: true
  github_admin:
    enabled: true

python:
  source_paths:
    - lib/python/project
    - pre-commit/hooks
  test_paths:
    - lib/python/tests
    - integration/tests
  stub_paths:
    - lib/python/stubs
  extra_paths:
    - lib/python
    - scripts
    - pre-commit/hooks
  venv_path: ..
  venv: .venv
  comment_suppressions:
    patterns:
      - regex: '#\s*custom:\s*bypass\b'
        label: custom bypass
  module_docs:
    source_docs_path: docs/SOURCE_DOCS.md
    banned_doc_filenames:
      - README.md
  direct_imports:
    packages:
      - project

  util_centralization:
    enabled: true
    banned_modules:
      - module: requests
        alternative: Use `project.http` instead.
        exempt_paths:
          - src/project/http.py

  sql_centralization:
    enabled: true
    module_name: project.sql
    central_paths:
      - src/project/sql.py
    min_string_length: 15

  structured_logging:
    logger_names:
      - logger
      - audit_log
    exempt_kwargs:
      - exc_info
      - stack_info
      - trace_id

  conditional_imports:
    capability_prefix: FEATURE_

  type_checking_imports:
    type_checking_names:
      - TYPE_CHECKING

  catch_and_silence:
    enabled: true

  optional_returns:
    exempt_method_names:
      - __exit__
      - __aexit__
      - maybe_cleanup

  security_patterns:
    secret_patterns:
      - sk-
      - hf_
      - token_
    test_file_markers:
      - tests
      - smoke_tests

  plan_completion:
    enabled: true
    metadata_filename: metadata.yaml
    root_markers:
      - docs/plans/

  pytest_gate:
    enabled: true
    test_command:
      - uv
      - run
      - pytest
      - lib/python/tests
      - integration/tests
      - --strict-markers

  file_docstrings:
    min_sentences: 4

  type_check:
    enabled: true
    excluded_path_fragments:
      - /docker/
      - vulture_whitelist
    checkers:
      - name: ruff
        enabled: true
        command:
          - ruff
          - check
          - --quiet
          - --ignore-noqa
          - --output-format
          - json
        pass_files_as_args: true
        use_hook_project: true
        config_flags:
          - --config
        repo_config: ruff.toml
      - name: pyright
        enabled: true
        command:
          - pyright
          - --outputjson
        pass_files_as_args: true
        use_hook_project: true
        config_flags:
          - --project
          - -p
        repo_config: pyrightconfig.json
      - name: mypy
        enabled: true
        command:
          - mypy
          - --output
          - json
        pass_files_as_args: true
        use_hook_project: true
        config_flags:
          - --config-file
        repo_config: mypy.ini
      - name: pylint
        enabled: false
        command:
          - pylint
          - --output-format=json
        pass_files_as_args: true
        use_hook_project: true
        config_flags:
          - --rcfile
        repo_config: .pylintrc

  docstring_coverage:
    enabled: true
    check_paths:
      - lib/python/project
    ignore_private: false
    ignore_nested_classes: false

  version_consistency:
    enabled: true

tooling:
  pyright:
    include:
      - lib/python/project
      - pre-commit/hooks
  pylint:
    disable:
      - missing-module-docstring
      - missing-class-docstring
      - missing-function-docstring
      - line-too-long
      - too-few-public-methods
      - duplicate-code
  golangci_lint:
    linters:
      enable:
        - ginkgolinter
      exclusions:
        rules:
          - path: internal/generated/
            linters:
              - lll
              - misspell

gemini:
  model: gemini-2.5-flash
  model_overrides:
    code_ethos: gemini-2.5-pro
  service_tier: standard
  service_tier_overrides:
    shell_review: flex
  cache:
    enabled: true
    ttl_seconds: 86400
    api_enabled: true
    api_ttl_seconds: 1800
  modal_allowlist_files:
    - scripts/bootstrap.sh

go:
  worktree: go
