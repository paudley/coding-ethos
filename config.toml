[outputs.report]
default_format = "toon"
include_temp = false

[outputs.prune]
enabled = true
auto_enabled = true
write_prune_trace = true

[outputs.prune.surfaces.hook_runs]
enabled = true
auto = false
max_age = "30d"
keep_last = 200
require_code_intel_ingest = true

[outputs.prune.surfaces.lint_traces]
enabled = true
auto = false
max_age = "30d"
keep_last = 500
require_code_intel_ingest = true

[outputs.prune.surfaces.prune_traces]
enabled = true
auto = false
max_age = "90d"
keep_last = 100

[outputs.prune.surfaces.proxy_temp_evidence]
enabled = true
auto = true
max_age = "24h"
max_bytes = "512MiB"

[outputs.prune.surfaces.code_intel_db]
enabled = true
auto = true
vacuum_after_prune = true
max_bytes = "2GiB"
row_retention_days = 90

[outputs.prune.surfaces.sandbox_tmp]
enabled = true
auto = true
max_age = "7d"

[outputs.prune.surfaces.sandbox_go_cache]
enabled = true
auto = true
max_age = "7d"
max_bytes = "2GiB"

[outputs.prune.surfaces.sandbox_golangci_cache]
enabled = true
auto = true
max_age = "7d"
max_bytes = "2GiB"

[outputs.prune.surfaces.agent_shell_cache]
enabled = true
auto = true
max_age = "24h"

[outputs.prune.surfaces.agent_shell_state]
enabled = true
auto = false
max_age = "30d"

[outputs.prune.surfaces.commit_head_state]
enabled = true
auto = false
max_age = "24h"

[outputs.prune.surfaces.runtime_cache]
enabled = true
auto = false
max_age = "30d"

[outputs.prune.surfaces.ci_sarif_artifact]
enabled = true
auto = false
max_age = "30d"
