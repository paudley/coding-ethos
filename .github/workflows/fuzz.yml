name: Fuzz

on:
  pull_request:
    paths:
      - ".github/workflows/fuzz.yml"
      - "go/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fuzz.yml"
      - "go/**"
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-fuzz:
    name: Go fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go/go.mod

      - name: Fuzz shell parser
        run: go test ./internal/shellparse -run '^$' -fuzz Fuzz -fuzztime=30s
        working-directory: go

      - name: Fuzz SARIF formatter
        run: go test ./internal/hookoutput -run '^$' -fuzz Fuzz -fuzztime=30s
        working-directory: go
