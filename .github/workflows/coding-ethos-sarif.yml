name: Coding Ethos SARIF Gate

on:
  workflow_call:


permissions:
  contents: read

jobs:
  coding-ethos:
    name: Coding Ethos SARIF Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      CODING_ETHOS_PATH: .
      CODING_ETHOS_REPO_ROOT: .
      CODING_ETHOS_GATE_COMMAND: make check
      CODING_ETHOS_SARIF_PATH: coding-ethos.sarif
      CODING_ETHOS_SARIF_CATEGORY: .github/workflows/ci.yml:policy
      CODING_ETHOS_FILES: ""
      CODING_ETHOS_GITHUB_BASE_REF: ${{ github.base_ref }}
      CODING_ETHOS_GITHUB_EVENT_NAME: ${{ github.event_name }}
      CODING_ETHOS_GITHUB_EVENT_BEFORE: ${{ github.event.before }}
      CODING_ETHOS_GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: ${{ env.CODING_ETHOS_PATH }}/go/go.mod
          cache-dependency-path: ${{ env.CODING_ETHOS_PATH }}/go/go.sum

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install coding-ethos sandbox AppArmor profile
        run: |
          set -euo pipefail
          profile=/etc/apparmor.d/coding-ethos-sandbox
          sandbox_path="${GITHUB_WORKSPACE}/bin/coding-ethos-sandbox"
          sudo tee "$profile" >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>

          profile coding-ethos-sandbox "$sandbox_path" flags=(unconfined) {
            userns,
            mount,
          }
          EOF
          sudo apparmor_parser -r "$profile"

      - name: Delegate Linux cgroup v2 controllers
        run: |
          set -euo pipefail
          cgroup_relative="$(
            awk -F: '$1 == "0" { print $3; exit }' /proc/self/cgroup
          )"
          cgroup_path="/sys/fs/cgroup${cgroup_relative}"
          if [ "$cgroup_relative" = "/" ] || \
            [ ! -f "$cgroup_path/cgroup.procs" ]; then
            echo "::error::cgroup target unavailable: $cgroup_path"
            exit 1
          fi

          sudo chown -R "$(id -u):$(id -g)" "$cgroup_path"
          verify_cgroup="$cgroup_path/coding-ethos-ci-verify-$$"
          mkdir "$verify_cgroup"
          cleanup() { rmdir "$verify_cgroup" 2>/dev/null || true; }
          trap cleanup EXIT

          sleep 60 &
          verify_pid="$!"
          if ! printf '%s\n' "$verify_pid" \
            > "$verify_cgroup/cgroup.procs"; then
            kill "$verify_pid" 2>/dev/null || true
            wait "$verify_pid" 2>/dev/null || true
            echo "::error::unable to assign a process to delegated cgroup"
            exit 1
          fi
          kill "$verify_pid" 2>/dev/null || true
          wait "$verify_pid" 2>/dev/null || true

      - name: Build coding-ethos runtime
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make -C "$CODING_ETHOS_PATH" build

      - name: Run project gate
        id: project-gate
        continue-on-error: true
        run: |
          ethos_path="$(cd "$CODING_ETHOS_PATH" && pwd)"
          export PATH="$ethos_path/bin:$PATH"
          if [ -n "$CODING_ETHOS_GATE_COMMAND" ]; then
            cd "$CODING_ETHOS_REPO_ROOT"
            bash -c "$CODING_ETHOS_GATE_COMMAND"
          fi

      - name: Emit coding-ethos SARIF
        id: emit-sarif
        if: ${{ always() }}
        continue-on-error: true
        run: '"$CODING_ETHOS_PATH/bin/coding-ethos-run" ci-sarif --provider github'

      - name: Upload coding-ethos SARIF
        if: ${{ always() && hashFiles(env.CODING_ETHOS_SARIF_PATH) != '' }}
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          sarif_file: ${{ env.CODING_ETHOS_SARIF_PATH }}
          category: ${{ env.CODING_ETHOS_SARIF_CATEGORY }}

      - name: Upload coding-ethos audit artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coding-ethos-audit
          if-no-files-found: ignore
          path: |
            ${{ env.CODING_ETHOS_SARIF_PATH }}
            ${{ env.CODING_ETHOS_REPO_ROOT }}/.coding-ethos/lint-runs/
            ${{ env.CODING_ETHOS_REPO_ROOT }}/.coding-ethos/hook-runs/

      - name: Fail on coding-ethos violations
        if: >-
          ${{ steps.project-gate.outcome == 'failure' ||
          steps.emit-sarif.outcome == 'failure' }}
        run: exit 1
