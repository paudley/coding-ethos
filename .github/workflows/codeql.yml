name: CodeQL

on:
  merge_group:
    branches:
      - main
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: go
            build-mode: manual
          - language: python
            build-mode: none

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Go
        if: ${{ matrix.language == 'go' }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go/go.mod

      - name: Install Bubblewrap
        if: ${{ matrix.language == 'go' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Initialize CodeQL
        uses: github/codeql-action/init@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended,security-and-quality

      - name: Build Go workspace
        if: ${{ matrix.language == 'go' }}
        run: |
          mkdir -p build/codeql
          go build \
            -o build/codeql/coding-ethos-policy \
            ./go/cmd/coding-ethos-policy
          ./build/codeql/coding-ethos-policy compile \
            --primary coding_ethos.yml \
            --config config.yaml \
            --out-dir build/policy
          go test -buildvcs=false -timeout=30s ./go/...

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          category: "/language:${{ matrix.language }}"
