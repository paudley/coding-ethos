            capability sys_admin,
            mount,
            remount,
          }

          "$sandbox_path" flags=(unconfined) {
            userns,
            capability sys_admin,
            mount,
            remount,
          }

          "$toolchain_path" flags=(unconfined) {
            userns,
            capability sys_admin,
            mount,
            remount,
          }

          # Parent-runtime e2e tests copy these binaries into temp repos and
          # execute them from .git/coding-ethos-hooks/bin; without a matching
          # attachment the copies run confined and sandbox mounts get EPERM.
