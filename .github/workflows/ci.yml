name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  actionlint:
    name: Validate GitHub workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build managed toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: make build

      - name: Run actionlint through coding-ethos
        run: >-
          bin/coding-ethos-run policy-tool actionlint
          .github/workflows/*.yml

  policy:
    name: Coding Ethos SARIF Gate
    uses: ./.github/workflows/coding-ethos-sarif.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --group dev --all-packages

      - name: Run test suite
        run: uv run pytest

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Validate package metadata
        run: uvx twine check dist/*.tar.gz dist/*.whl

      - name: Generate distribution checksums
        run: |
          mkdir -p dist-checksums
          sha256sum dist/*.tar.gz dist/*.whl > dist-checksums/SHA256SUMS

      - name: Prepare SBOM output directory
        run: mkdir -p sbom

      - name: Generate distribution SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          output-file: sbom/coding-ethos.spdx.json
          format: spdx-json
          upload-artifact: false

      - name: Attest distribution artifacts
        # SLSA provenance binds each built distribution to this repository,
        # workflow identity, commit, and build event through GitHub OIDC.
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl

      - name: Attest distribution checksums
        # The checksum file is a release-facing trust artifact, so it receives
        # its own provenance instead of being treated as incidental output.
        uses: actions/attest@v4
        with:
          subject-path: dist-checksums/SHA256SUMS

      - name: Attest distribution SBOM
        # SBOM mode binds the SPDX document to the distribution subjects listed
        # in SHA256SUMS. Do not replace this with the deprecated attest-sbom
        # wrapper.
        uses: actions/attest@v4
        with:
          subject-checksums: dist-checksums/SHA256SUMS
          sbom-path: sbom/coding-ethos.spdx.json

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

      - name: Upload distribution checksums
        uses: actions/upload-artifact@v7
        with:
          name: dist-checksums
          path: dist-checksums/SHA256SUMS
          if-no-files-found: error

      - name: Upload distribution SBOM
        uses: actions/upload-artifact@v7
        with:
          name: dist-sbom
          path: sbom/coding-ethos.spdx.json
          if-no-files-found: error
