name: OSV-Scanner

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "18 16 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: OSV dependency scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Run OSV scanner
        id: osv
        continue-on-error: true
        run: >-
          go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.5
          --format=sarif
          --output-file=osv-results.sarif
          -r
          ./

      - name: Upload OSV SARIF
        if: ${{ always() && hashFiles('osv-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@68bde559dea0fdcac2102bfdf6230c5f70eb485e
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner

      - name: Upload OSV artifact
        if: ${{ always() && hashFiles('osv-results.sarif') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: osv-scanner-sarif
          path: osv-results.sarif
          if-no-files-found: error

      - name: Fail on OSV findings
        if: ${{ steps.osv.outcome == 'failure' }}
        run: exit 1
