name: OSV-Scanner

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "18 16 * * 3"
  workflow_dispatch:

jobs:
  scan-scheduled:
    name: OSV scheduled scan
    if: >-
      ${{ github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' }}
    uses: >-
      google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@c51854704019a247608d928f370c98740469d4b5
    permissions:
      contents: read
      security-events: write
    with:
      scan-args: |-
        -r
        --skip-git
        ./

  scan-pr:
    name: OSV PR scan
    if: >-
      ${{ github.event_name == 'pull_request' ||
      github.event_name == 'merge_group' }}
    uses: >-
      google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@1f1242919d8a60496dd1874b24b62b2370ed4c78
    permissions:
      contents: read
      security-events: write
    with:
      scan-args: |-
        -r
        --skip-git
        ./
