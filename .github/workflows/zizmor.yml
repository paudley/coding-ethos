name: Zizmor

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: "52 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Zizmor GitHub Actions security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Run zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uvx zizmor==1.24.1
          --format=sarif
          --no-progress
          .
          > zizmor.sarif

      - name: Upload zizmor SARIF
        if: ${{ always() && hashFiles('zizmor.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: Upload zizmor artifact
        if: ${{ always() && hashFiles('zizmor.sarif') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zizmor-sarif
          path: zizmor.sarif
          if-no-files-found: error
