version: 1

project:
  name: coding-ethos
  review_context: Shared ETHOS generation and enforcement tooling.
  ethos_candidates:
    - ETHOS.md
    - code-ethos/ETHOS.md

gemini:
  enabled: false
  model: gemini-2.5-flash
  model_overrides: {}
  service_tier: standard
  service_tier_overrides: {}
  thinking_budget_overrides: {}
  repo_name: coding-ethos
  repo_context: shared repository automation and engineering tooling
  max_retries: 3
  timeout_seconds: 300
  initial_backoff_seconds: 1.0
  max_concurrent_api_calls: 10
  disable_safety_filters: true
  cache:
    enabled: true
    ttl_seconds: 604800
    dirname: gemini-cache
    api_enabled: true
    api_ttl_seconds: 3600
  modal_allowlist_files: []

style:
  python_version: "3.13"
  line_length: 88

bundle:
  local_bin_dirname: coding-ethos-hooks
  bundle_dir_candidates:
    - pre-commit
    - code-ethos/pre-commit
  consumer_override_candidates:
    - repo_config.yaml
    - repo_config.yml
    - code-ethos.repo.yaml
    - code-ethos.repo.yml
    - coding-ethos.repo.yaml
    - coding-ethos.repo.yml
    - code-ethos.pre-commit.yaml
    - code-ethos.pre-commit.yml
    - coding-ethos.pre-commit.yaml
    - coding-ethos.pre-commit.yml

hooks:
  output_format: auto
  success_output: silent
  parallel_groups: true
  tool_timeout_seconds: 300
  agent_env_markers:
    - CODEX_THREAD_ID
    - CODEX_CI
    - CODEX_MANAGED_BY_NPM
    - CLAUDECODE
    - CLAUDE_CODE_ENTRYPOINT
    - CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC
    - GEMINI_CLI
    - AIDER_MODEL
    - CURSOR_TRACE_ID
  enabled_groups:
    - format
    - syntax
    - python-policy
    - python-static
    - docs
    - security
    - shell
    - docker
    - workflow
    - python-quality
    - go
    - ai
    - commit-msg
  fail_severity_levels:
    - error
    - fatal
    - critical
  warn_severity_levels:
    - warning
    - warn

generated_config:
  freshness:
    enabled: true

syntax:
  file_syntax:
    enabled: true
    extensions:
      - .json
      - .toml
      - .yaml
      - .yml
  merge_conflict:
    enabled: true
    markers:
      - '<<<<<<<'
      - '======='
      - '>>>>>>>'
      - '|||||||'

policy:
  evidence_maps:
    - source: ruff
      codes:
        - PLC0415
      policy_id: python.conditional_imports
      principle_ids:
        - no-conditional-imports
        - fail-fast-fail-hard-overview
      confidence: high
      meaning: >-
        Import executes away from module scope, usually inside runtime control
        flow, hiding a required dependency or masking cyclic design pressure.
      advice:
        summary: >-
          Move required imports to module scope. If that exposes a cycle, fix
          the design instead of hiding the dependency.
        steps:
          - Declare the dependency as required.
          - Import it at module scope.
          - >-
            Use SOLID boundaries to split responsibilities when modules depend
            on each other.
          - >-
            In Python, introduce a Protocol in a neutral module when two
            concrete implementations would otherwise import each other.
          - >-
            Replace lazy, conditional, or fallback import paths with explicit
            startup validation.
        rerun:
          - make pre-commit
          - make check
    - source: mypy
      codes:
        - no-any-return
      policy_id: python.optional_returns
      principle_ids:
        - no-optional-types-for-required-dependencies
        - static-analysis-is-the-first-line-of-defense
      confidence: medium
      meaning: A required return path is leaking Any instead of a precise type.
      advice:
        summary: Replace Any return flow with an explicit required type.
        steps:
          - Identify the source of Any.
          - Add the missing annotation or typed adapter at the boundary.
          - Keep required dependencies non-optional.
        rerun:
          - make pre-commit
          - make check
    - source: shellcheck
      codes:
        - SC*
      policy_id: shell.static_analysis
      principle_ids:
        - static-analysis-is-the-first-line-of-defense
        - linting-as-code-quality-enforcement
      confidence: medium
      meaning: Shellcheck found shell behavior that is fragile or ambiguous.
      advice:
        summary: Fix the shell script structure instead of suppressing ShellCheck.
        steps:
          - Quote expansions and make data flow explicit.
          - Prefer arrays and checked commands over stringly shell assembly.
          - Keep shell behavior deterministic under strict mode.
        rerun:
          - make pre-commit
    - source: yamllint
      codes:
        - indentation
        - truthy
      policy_id: yaml.config_clarity
      principle_ids:
        - validation-at-the-gate
        - documentation-as-contract
      confidence: medium
      meaning: YAML structure or scalar spelling is ambiguous for configuration.
      advice:
        summary: Make YAML configuration explicit and parser-stable.
        steps:
          - Fix indentation to match the intended structure.
          - Quote ambiguous scalars when the value is meant to be a string.
          - Keep configuration readable enough to review in diffs.
        rerun:
          - make pre-commit
    - source: hadolint
      codes:
        - DL*
      policy_id: docker.reproducible_builds
      principle_ids:
        - security-by-design
        - evidence-based-engineering-and-decision-quality
      confidence: medium
      meaning: >-
        Dockerfile instructions are weakening reproducibility or container
        safety.
      advice:
        summary: Make the container build deterministic and least-privilege.
        steps:
          - Pin package versions where practical.
          - Avoid broad shell pipelines that hide failures.
          - Prefer explicit users, trusted sources, and minimal layers.
        rerun:
          - make pre-commit
    - source: actionlint
      codes:
        - "*"
      policy_id: workflow.validation
      principle_ids:
        - validation-at-the-gate
        - testing-as-specification
      confidence: high
      meaning: GitHub Actions workflow syntax or expression behavior is invalid.
      advice:
        summary: Fix workflow definitions before relying on CI as a quality gate.
        steps:
          - Validate expressions, job wiring, and event-specific context.
          - Keep workflow behavior explicit instead of depending on runtime surprises.
          - Re-run the workflow hook locally before pushing.
        rerun:
          - make pre-commit
    - source: golangci-lint
      codes:
        - errcheck
        - gosec
        - staticcheck
        - revive
      policy_id: go.static_analysis
      principle_ids:
        - static-analysis-is-the-first-line-of-defense
        - linting-as-code-quality-enforcement
      confidence: high
      meaning: Go static analysis found correctness, security, or maintainability risk.
      advice:
        summary: Fix the Go issue structurally and keep golangci-lint blocking.
        steps:
          - Handle errors explicitly.
          - Remove suspicious or insecure constructs instead of suppressing them.
          - Prefer a small refactor over weakening lint coverage.
        rerun:
          - make pre-commit
          - make check

git:
  hook_bypass:
    enabled: true
  destructive_command:
    enabled: true
  merge_strategy_shortcut:
    enabled: true
  force_push_protected_branch:
    enabled: true
  checkout_protected_branch:
    enabled: true
  destructive_worktree:
    enabled: true
  change_dir_flag:
    enabled: true
  stash_blocked:
    enabled: true
  commit_head_advanced:
    enabled: true
  wrapper_required:
    enabled: true
  staged_admin_files:
    enabled: true
    basenames:
      - .pre-commit-config.yaml
      - pre-commit-config.yaml
      - .importlinter
      - importlinter
      - .pylintrc
      - pylintrc
      - pyproject.toml
    dirs:
      - .pre-commit
      - pre-commit

filesystem:
  protected_path:
    enabled: true
    paths:
      - coding-ethos-hooks/coding-ethos-git-hook
      - coding-ethos-hooks/bin/coding-ethos-agent-hooks
      - coding-ethos-hooks/bin/coding-ethos-git
      - coding-ethos-hooks/bin/coding-ethos-git-hook
      - coding-ethos-hooks/bin/coding-ethos-hook
      - coding-ethos-hooks/bin/coding-ethos-lint
      - coding-ethos-hooks/bin/coding-ethos-policy
      - coding-ethos-hooks/lefthook
  protected_branch_write:
    enabled: true
    branches:
      - main
      - master
    exempt_path_prefixes:
      - .claude/
      - docs/plans/
  required_ignores:
    enabled: true
    paths:
      - .coding-ethos/
      - .coding-ethos/hook-runs/example/stdout.log
  pii_scrubber:
    enabled: true
    patterns:
      - '/(home|Users)/[A-Za-z0-9._-]+/'
      - 'lbox-worktrees/[A-Za-z0-9._-]+'
      - '/tmp/tmp\.[A-Za-z0-9._-]+'
    literals: []
    exempt_prefixes:
      - .git/
  license_header:
    enabled: true
    extensions:
      - .go
      - .py
      - .sh
    exempt_prefixes:
      - .git/
    exempt_basenames: []
    required:
      - 'SPDX-FileCopyrightText:'
      - 'SPDX-License-Identifier:'
    scan_lines: 5
  shebangs:
    enabled: true
  large_files:
    enabled: true
    exclude_prefixes: []
    suffixes:
      - .bash
      - .json
      - .sh
      - .toml
      - .yaml
      - .yml
    max_kb: 500
  line_limits:
    enabled: true
    python_hard: 1000
    shell_hard: 500

shell:
  dangerous_command:
    enabled: true
  background_git:
    enabled: true
  github_admin:
    enabled: true
  best_practices:
    enabled: true
    require_common_for_prefixes:
      - scripts/
  forbidden_strings:
    enabled: true
    exempt_paths:
      - config.yaml
    file_strings:
      - PLC0415
    strings:
      - /.claude/settings.json
      - /.claude/settings.local.json
      - ~/.claude/settings.json
      - ~/.claude/settings.local.json
      - /.codex/config.toml
      - /.codex/hooks.json
      - /.gemini/settings.json
      - coding-ethos-hooks/coding-ethos-git-hook
      - coding-ethos-hooks/bin/coding-ethos-agent-hooks
      - coding-ethos-hooks/bin/coding-ethos-git
      - coding-ethos-hooks/bin/coding-ethos-git-hook
      - coding-ethos-hooks/bin/coding-ethos-hook
      - coding-ethos-hooks/bin/coding-ethos-lint
      - coding-ethos-hooks/bin/coding-ethos-policy
      - coding-ethos-hooks/lefthook
      - /coding-ethos/pre-commit/hooks/
      - /coding-ethos/go/internal/
      - /coding-ethos/config.yaml
      - /coding-ethos/ruff.toml
      - /coding-ethos/.golangci.yml
      - header must match

security:
  private_key:
    enabled: true
    pattern: '-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----'

agent_advice:
  reminders:
    quiet_frequency: 3
    items:
      - principle_id: evidence-based-engineering-and-decision-quality
        axiom: Todo lists prevent partial work from masquerading as completion.
        action: >-
          Keep the task list current, mark progress as it happens, and do not
          report done while planned work remains.
      - principle_id: no-rationalized-shortcuts
        axiom: Laziness only moves the cost downstream.
        action: >-
          Stop, use the documented path, and do not trade correctness for
          completion.
      - principle_id: testing-as-specification
        axiom: A green process is not the same as a correct result.
        action: >-
          Define success by user-visible behavior and inspect representative
          output.
      - principle_id: static-analysis-is-the-first-line-of-defense
        axiom: Static analysis is a gate, not background noise.
        action: Treat the finding as a structural signal and fix the cause.
      - principle_id: no-conditional-imports
        axiom: Conditional imports are banned.
        action: >-
          Use module-scope required imports; if that exposes a cycle, refactor
          with SOLID boundaries or a Python Protocol instead of hiding the
          dependency.
      - principle_id: linting-as-code-quality-enforcement
        axiom: A linter warning is review feedback in executable form.
        action: Resolve it structurally instead of weakening the rule.
      - principle_id: forward-motion-only
        axiom: History is context, not an excuse.
        action: Fix the current state with evidence and move forward.

python:
  source_paths:
    - coding_ethos
    - pre-commit/hooks
  test_paths:
    - tests
  stub_paths: []
  extra_paths:
    - .
    - pre-commit/hooks
  venv_path: .
  venv: .venv

  comment_suppressions:
    enabled: true
    patterns:
      - regex: '#\s*ruff:\s*noqa\b'
        label: 'ruff: noqa (file-level)'
      - regex: '#\s*mypy:\s*ignore-errors\b'
        label: 'mypy: ignore-errors (file-level)'
      - regex: '#\s*noqa\b'
        label: 'noqa'
      - regex: '#\s*type:\s*ignore\b'
        label: 'type: ignore'
      - regex: '#\s*pragma:\s*no\s*cover\b'
        label: 'pragma: no cover'
      - regex: '#\s*pylint:\s*disable'
        label: 'pylint: disable'
      - regex: '#\s*noinspection\b'
        label: 'noinspection'
      - regex: '#\s*fmt:\s*(off|on|skip)\b'
        label: 'fmt: off/on/skip'
      - regex: '#\s*isort:\s*(skip|skip_file)\b'
        label: 'isort: skip'
      - regex: '#\s*pyright:\s*ignore\b'
        label: 'pyright: ignore'

  module_docs:
    enabled: true
    source_docs_path: docs/SOURCE_DOCS.md
    check_filenames:
      - __init__.py
      - conftest.py
    excluded_dirs:
      - .venv
      - .lint-cache
      - .mypy_cache
      - .ruff_cache
      - __pycache__
      - node_modules
      - .git
    banned_doc_filenames:
      - README.md
      - readme.md

  direct_imports:
    enabled: true
    packages:
      - coding_ethos

  util_centralization:
    enabled: false
    banned_modules: []

  structured_logging:
    enabled: true
    methods:
      - debug
      - info
      - warning
      - error
      - critical
    logger_names:
      - logger
      - _logger
      - log
      - _log
    exempt_kwargs:
      - exc_info
      - stack_info
      - stacklevel

  conditional_imports:
    enabled: true
    exception_names:
      - ImportError
      - ModuleNotFoundError
    capability_prefix: HAS_

  type_checking_imports:
    enabled: true
    type_checking_names:
      - TYPE_CHECKING
    future_import_name: annotations

  catch_and_silence:
    enabled: true

  optional_returns:
    enabled: true
    exempt_method_names:
      - __exit__
      - __aexit__

  security_patterns:
    enabled: true
    sql_keywords:
      - SELECT
      - INSERT
      - UPDATE
      - DELETE
      - DROP
      - CREATE
      - ALTER
      - TRUNCATE
      - EXECUTE
      - EXEC
    secret_patterns:
      - sk-
      - pk-
      - api_
      - key_
      - token_
      - secret_
      - password
      - passwd
      - credential
    test_file_markers:
      - tests
      - conftest
      - test_
      - _test.py
    min_getenv_args_with_default: 2

  sql_centralization:
    enabled: false
    module_name: project.sql
    central_paths: []
    exempt_paths:
      - tests
    migration_markers:
      - alembic
      - migrations
    min_string_length: 15
    error_context_keywords:
      - suggestion
      - reason
      - message
      - match
      - extra

  manifest_validation:
    enabled: false
    candidate_paths:
      - manifest.yaml
      - code-ethos/manifest.yaml
    required_string_fields:
      - version
    required_list_sections:
      symlinks:
        required: true
        required_string_fields:
          - source
          - target
      repositories:
        required: false
        required_string_fields:
          - name
          - url
        optional_string_fields:
          - branch

  plan_completion:
    enabled: false
    metadata_filename: metadata.yaml
    root_markers:
      - docs/plans/
    completed_status_values:
      - review
      - complete

  pytest_gate:
    enabled: true
    banned_markers:
      - skip
      - skipif
    test_command:
      - uv
      - run
      - --frozen
      - pytest
      - tests
      - --strict-markers

  file_docstrings:
    enabled: true
    min_sentences: 3
    exempt_filenames:
      - __init__.py
      - conftest.py

  docstring_coverage:
    enabled: true
    threshold: 90
    command:
      - interrogate
    use_hook_project: true
    verbose: true
    ignore_init_method: true
    ignore_init_module: true
    ignore_magic: true
    ignore_private: true
    ignore_semiprivate: true
    ignore_property_decorators: true
    ignore_nested_functions: true
    ignore_nested_classes: true
    check_paths:
      - coding_ethos
      - pre-commit/hooks
    exclude_patterns:
      - __pycache__
      - \.venv
      - tests
      - .*_test\.py$
      - test_.*\.py$

  version_consistency:
    enabled: true

  pyproject_ignores:
    enabled: true
    allowed_ignore_patterns:
      - tests/**
      - tests/*
      - '**/tests/**'
      - '**/tests/*'
      - test_*.py
      - '*_test.py'
      - stubs/**
      - stubs/*
      - '**/stubs/**'
      - '**/stubs/*'
    allowed_exclude_patterns:
      - .git
      - .venv
      - .mypy_cache
      - .ruff_cache
      - __pycache__
      - '*.egg-info'
      - .eggs
      - build
      - dist
      - node_modules
    allowed_mypy_missing_imports: []

  type_check:
    enabled: true
    excluded_path_fragments:
      - /docker/
      - vulture_whitelist
    checkers:
      - name: ruff
        enabled: true
        command:
          - ruff
          - check
          - --quiet
          - --ignore-noqa
          - --output-format
          - json
        pass_files_as_args: true
        use_hook_project: true
        config_flags:
          - --config
        repo_config: ruff.toml
      - name: pyright
        enabled: true
        command:
          - pyright
          - --outputjson
        pass_files_as_args: true
        use_hook_project: true
        config_flags:
          - --project
          - -p
        repo_config: pyrightconfig.json
        fallback_bundle_config: hooks/pyproject.toml
      - name: mypy
        enabled: true
        command:
          - mypy
          - --output
          - json
        pass_files_as_args: true
        use_hook_project: true
        config_flags:
          - --config-file
        repo_config: mypy.ini
        fallback_bundle_config: hooks/pyproject.toml
      - name: pylint
        enabled: false
        command:
          - pylint
          - --output-format=json
        pass_files_as_args: true
        use_hook_project: true
        config_flags:
          - --rcfile
        repo_config: .pylintrc

tooling:
  pyright:
    enabled: true
    type_checking_mode: strict
    include: []
    exclude:
      - "**/tests/**"
      - "**/*_test.py"
      - "**/test_*.py"
      - "**/.venv/**"
    extra_paths: []
    venv_path: ""
    venv: ""
    stub_path: ""

  mypy:
    enabled: true
    strict: true
    warn_unused_configs: true
    plugins:
      - pydantic.mypy
    files: []
    mypy_path: ""
    exclude_patterns:
      - (^|/)tests/
      - (^|/).*_test\.py$
      - (^|/)test_.*\.py$
      - (^|/)\.venv/

  ruff:
    enabled: true
    target_version: py313
    select:
      - ALL
    ignore:
      - COM812
      - ISC001
      - D203
      - D213
      - S603
      - S607
      - T201
      - TC
      - TC001
      - TC002
      - TC003
      - TC004
    exclude:
      - .git
      - .venv
      - .mypy_cache
      - .ruff_cache
      - __pycache__
      - '*.egg-info'
      - .eggs
      - build
      - dist
      - node_modules
    max_args: 6
    stub_per_file_ignores:
      - A001
      - A002
      - ANN401
      - D
      - FBT001
      - FBT002
      - N801
      - N803
      - PYI020
      - RUF100
      - TCH
      - UP037
    test_per_file_ignores:
      - ANN401
      - ARG001
      - ARG002
      - B017
      - D
      - E501
      - EM101
      - EM102
      - PERF401
      - PLR0913
      - PLR2004
      - PT011
      - PT012
      - RUF012
      - S101
      - S105
      - S106
      - SIM117
      - SLF001
      - TC003
      - TRY003
    sql_per_file_ignores:
      - S608
    extra_per_file_ignores: {}
    banned_api:
      dateutil.tz: Use `zoneinfo` instead.
      importlib: banned, use standard imports

  pylint:
    enabled: true
    jobs: 0
    persistent: false
    reports: false
    score: false
    ignore:
      - .git
      - .venv
      - .mypy_cache
      - .ruff_cache
      - __pycache__
      - build
      - dist
      - node_modules
    ignore_paths:
      - (^|/)\.git/
      - (^|/)\.venv/
      - (^|/)__pycache__/
      - (^|/)\.mypy_cache/
      - (^|/)\.ruff_cache/
      - (^|/)build/
      - (^|/)dist/
      - (^|/)node_modules/
    disable:
      - missing-module-docstring
      - missing-class-docstring
      - missing-function-docstring
      - line-too-long
      - too-few-public-methods
      - duplicate-code
      - import-error
      - no-member
      - too-many-instance-attributes
      - too-many-locals
      - too-many-branches
      - too-many-statements
      - fixme
    good_names:
      - i
      - j
      - k
      - ex
      - _
    max_args: 6

  yamllint:
    enabled: true
    extends: default
    rules:
      comments: disable
      comments-indentation: disable
      document-start: disable
      line-length:
        allow-non-breakable-inline-mappings: true
        allow-non-breakable-words: true
      truthy:
        allowed-values:
          - "true"
          - "false"
        check-keys: false

  golangci_lint:
    version: "2"
    run:
      tests: true
    issues:
      max-issues-per-linter: 0
      max-same-issues: 0
    linters:
      default: standard
      enable:
        - asasalint
        - asciicheck
        - bidichk
        - bodyclose
        - canonicalheader
        - containedctx
        - contextcheck
        - copyloopvar
        - cyclop
        - decorder
        - depguard
        - dogsled
        - dupl
        - dupword
        - durationcheck
        - embeddedstructfieldcheck
        - err113
        - errcheck
        - errchkjson
        - errname
        - errorlint
        - exhaustive
        - exptostd
        - fatcontext
        - forbidigo
        - forcetypeassert
        - funcorder
        - funlen
        - gocheckcompilerdirectives
        - gochecknoglobals
        - gochecknoinits
        - gochecksumtype
        - gocognit
        - goconst
        - gocritic
        - gocyclo
        - godoclint
        - godot
        - godox
        - gomoddirectives
        - gomodguard
        - goprintffuncname
        - gosec
        - govet
        - grouper
        - iface
        - importas
        - inamedparam
        - interfacebloat
        - intrange
        - iotamixing
        - lll
        - loggercheck
        - maintidx
        - makezero
        - mirror
        - misspell
        - mnd
        - modernize
        - musttag
        - nakedret
        - nestif
        - nilerr
        - nilnesserr
        - nilnil
        - nlreturn
        - noctx
        - noinlineerr
        - nolintlint
        - nonamedreturns
        - nosprintfhostport
        - paralleltest
        - perfsprint
        - prealloc
        - predeclared
        - promlinter
        - protogetter
        - reassign
        - recvcheck
        - revive
        - rowserrcheck
        - sloglint
        - spancheck
        - sqlclosecheck
        - staticcheck
        - tagalign
        - tagliatelle
        - testableexamples
        - testpackage
        - testifylint
        - thelper
        - tparallel
        - unconvert
        - unparam
        - unqueryvet
        - unused
        - usestdlibvars
        - usetesting
        - varnamelen
        - wastedassign
        - whitespace
        - wrapcheck
        - wsl_v5
        - zerologlint
      exclusions:
        generated: strict
        warn-unused: true
        presets:
          - comments
          - common-false-positives
          - legacy
          - std-error-handling
      settings:
        cyclop:
          max-complexity: 12
        depguard:
          rules:
            main:
              deny:
                - pkg: github.com/pkg/errors
                  desc: Use standard errors plus fmt.Errorf("%w") wrapping.
                - pkg: io/ioutil
                  desc: Use os or io package replacements.
        errcheck:
          check-blank: true
          check-type-assertions: true
        funlen:
          lines: 80
          statements: 60
        gocognit:
          min-complexity: 20
        gocyclo:
          min-complexity: 12
        gosec:
          excludes:
            - G101
            - G304
        govet:
          enable-all: true
        gomoddirectives:
          replace-allow-list: []
          retract-allow-no-explanation: false
          exclude-forbidden: false
        lll:
          tab-width: 1
        nestif:
          min-complexity: 4
        revive:
          severity: error
        tagliatelle:
          case:
            rules:
              json: snake
              yaml: snake
        testifylint:
          enable-all: true

go:
  enabled: false
  worktree: pre-commit/hooks/go-hooks
  commitlint:
    enabled: true
    allowed_types:
      - chore
      - docs
      - feat
      - fix
      - perf
      - refactor
      - test
    ignored_prefixes:
      - 'Merge '
      - 'Revert '
      - 'fixup! '
      - 'squash! '
    max_header_length: 150
  commit_attribution:
    enabled: true
    blocked_names:
      - claude
      - anthropic
      - gpt
      - chatgpt
      - openai
      - copilot
      - github copilot
      - ai assistant
      - ai agent
      - llm
      - large language model
      - gemini
      - bard
      - cursor
  text:
    forbidden_strings:
      - PLC0415
    large_file_exclude_prefixes: []
    large_file_suffixes:
      - .bash
      - .json
      - .sh
      - .toml
      - .yaml
      - .yml
    max_large_file_kb: 500
  line_limits:
    python_hard: 1000
    python_warn: 800
    shell_hard: 500
    shell_warn: 400
  shell:
    require_common_for_prefixes:
      - scripts/
  quiet_filter:
    ansi_regex: \x1b\[[0-9;]*m
    passed_regex: \.{3,}Passed$
    skipped_regex: (\.{3,}Skipped$|\(no files to check\)Skipped$)
    failed_regex: \.{3,}Failed$
    status_regex: \.{3,}(Failed|Passed|Skipped)$
    preexisting_regex: ^\s*\[Pre-existing \([0-9]+\)\]$
    separator_regex: ^={50,}$
    banner_width: 70
    metadata_prefixes:
      - '- hook id:'
      - '- duration:'
      - '- files were modified'
    suppress_exact:
      - All checks passed!
      - Analyzing diff for changed lines...
    suppress_prefixes:
      - '- files were modified'
      - Both GOOGLE_API_KEY and GEMINI_API_KEY
      - '[WARNING] Unstaged'
      - '  Failed to get diff for'
    suppress_regexes:
      - '^[0-9]+ files? already formatted$'
      - '^[0-9].*files? already formatted$'
      - '^\[INFO\] (Stashing|Restored)'
      - '^  (Rate limited|Timeout|Service unavailable|Error), waiting'
      - '^  Skipping .* \(>[0-9]+KB\)'
      - '^Running [0-9]+ check types in parallel'
      - '^OK .*: PASS \([0-9]+ms\)$'
      - '^Summary: [0-9]+ passed'
      - '^Total time: [0-9]+ms'
      - '^\[.*\] Processing [0-9]+ files'
      - '^\[.*\] Batch error:'
