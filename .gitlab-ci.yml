workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - policy
  - test
  - build


coding_ethos_sarif:
  stage: policy
  interruptible: true
  timeout: 30m
  variables:
    CODING_ETHOS_PATH: .
    CODING_ETHOS_REPO_ROOT: .
    CODING_ETHOS_GATE_COMMAND: make check
    CODING_ETHOS_SARIF_PATH: coding-ethos.sarif
    CODING_ETHOS_SANDBOX_MODE: required
    CODING_ETHOS_FILES: ""
  script:
    - make -C "$CODING_ETHOS_PATH" build
    - |
      if [ -n "$CODING_ETHOS_GATE_COMMAND" ]; then
        ethos_path="$(cd "$CODING_ETHOS_PATH" && pwd)"
        export PATH="$ethos_path/bin:$PATH"
        cd "$CODING_ETHOS_REPO_ROOT"
        bash -c "$CODING_ETHOS_GATE_COMMAND"
        cd "$CI_PROJECT_DIR"
      fi
    - |
      repo_root="$(cd "$CODING_ETHOS_REPO_ROOT" && pwd)"
      ethos_path="$(cd "$CODING_ETHOS_PATH" && pwd)"
      files_path="$(mktemp)"
      sarif_tmp="$CODING_ETHOS_SARIF_PATH.tmp"
      empty_git_sha="0000000000000000000000000000000000000000"
      rm -f "$sarif_tmp" "$CODING_ETHOS_SARIF_PATH"

      if [ -n "$CODING_ETHOS_FILES" ]; then
        printf '%s\n' "$CODING_ETHOS_FILES" | tr ',' '\n' > "$files_path"
      elif [ -n "$CI_MERGE_REQUEST_TARGET_BRANCH_SHA" ]; then
        git diff --name-only "$CI_MERGE_REQUEST_TARGET_BRANCH_SHA"...HEAD |
          while IFS= read -r path; do
            [ -f "$path" ] && printf '%s\n' "$path"
          done > "$files_path"
      elif [ -n "$CI_COMMIT_BEFORE_SHA" ] &&
        [ "$CI_COMMIT_BEFORE_SHA" != "$empty_git_sha" ] &&
        git rev-parse --verify "$CI_COMMIT_BEFORE_SHA^{commit}" >/dev/null 2>&1
      then
        git diff --name-only "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA" |
          while IFS= read -r path; do
            [ -f "$path" ] && printf '%s\n' "$path"
          done > "$files_path"
      else
        : > "$files_path"
      fi

      set +e
      "$ethos_path/bin/coding-ethos-run" policy-lint \
        --cwd "$repo_root" \
        --scope files \
        --files-from "$files_path" \
        --sandbox-mode "$CODING_ETHOS_SANDBOX_MODE" \
        --sarif > "$sarif_tmp"
      status=$?
      if [ -s "$sarif_tmp" ]; then
        mv "$sarif_tmp" "$CODING_ETHOS_SARIF_PATH"
      else
        rm -f "$sarif_tmp"
      fi
      exit "$status"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - "$CODING_ETHOS_SARIF_PATH"
      - .coding-ethos/lint-runs/
      - .coding-ethos/hook-runs/

coding_ethos_test:
  stage: test
  interruptible: true
  timeout: 30m
  script:
    - uv run pytest
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - .coding-ethos/

coding_ethos_build:
  stage: build
  interruptible: true
  timeout: 30m
  script:
    - uv build
    - uvx twine check dist/*
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/
