workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

stages:
  - policy
  - test
  - build


coding_ethos_sarif:
  stage: policy
  interruptible: true
  timeout: 30m
  variables:
    CODING_ETHOS_PATH: .
    CODING_ETHOS_REPO_ROOT: .
    CODING_ETHOS_GATE_COMMAND: make check
    CODING_ETHOS_SARIF_PATH: coding-ethos.sarif
    CODING_ETHOS_FILES: ""
  script:
    - make -C "$CODING_ETHOS_PATH" build
    - |
      if [ -n "$CODING_ETHOS_GATE_COMMAND" ]; then
        ethos_path="$(cd "$CODING_ETHOS_PATH" && pwd)"
        export PATH="$ethos_path/bin:$PATH"
        cd "$CODING_ETHOS_REPO_ROOT"
        bash -c "$CODING_ETHOS_GATE_COMMAND"
        cd "$CI_PROJECT_DIR"
      fi
    - |
      "$CODING_ETHOS_PATH/bin/coding-ethos-run" ci-sarif --provider gitlab
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - "$CODING_ETHOS_SARIF_PATH"
      - .coding-ethos/lint-runs/
      - .coding-ethos/hook-runs/

coding_ethos_test:
  stage: test
  interruptible: true
  timeout: 30m
  script:
    - uv run pytest
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - .coding-ethos/

coding_ethos_build:
  stage: build
  interruptible: true
  timeout: 30m
  script:
    - uv build
    - uvx twine check dist/*
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - dist/
